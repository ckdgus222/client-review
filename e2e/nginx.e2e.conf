# 브라우저 e2e용 nginx 설정(docs/landing.md 정할 것 3). 배포와 같은 landing.conf로 소개·약관을 보내고,
# 앱과 api는 e2e가 띄운 개발 서버로 넘겨서 4103 한 주소에서 소개 → 로그인 → 방침을 실제로 눌러 간다.
# 컨테이너 안에서 맥의 서버는 host.docker.internal이다(docker run --add-host가 이 이름을 만든다).
server {
    listen 80;
    absolute_redirect off;
    root /usr/share/nginx/html;

    include /etc/nginx/landing.conf;

    location /app/ {
        proxy_pass http://host.docker.internal:5174;
        # web 개발 서버(Vite)는 모르는 Host를 막는다. 브라우저가 연 주소(localhost:4103)를 그대로 넘긴다.
        proxy_set_header Host $http_host;
        # 화면을 고치면 바로 다시 그리는 연결(웹소켓)도 넘긴다. 안 넘기면 개발 서버 연결 오류가 콘솔에 남는다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://host.docker.internal:4101;
        proxy_set_header Host $http_host;
    }
}
