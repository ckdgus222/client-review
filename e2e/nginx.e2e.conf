# 브라우저 e2e용 nginx 설정(docs/landing.md 정할 것 3). 배포와 같은 landing.conf로 소개·약관을 보내고,
# 앱과 api는 e2e가 띄운 개발 서버로 넘겨서 4103 한 주소에서 소개 → 로그인 → 방침을 실제로 눌러 간다.
# 컨테이너 안에서 맥의 서버는 host.docker.internal이다(docker run --add-host가 이 이름을 만든다).
include /etc/nginx/limit-zones.conf;

# login-limit.conf가 변수($api_upstream)로 넘겨서, 이름을 요청 때 찾을 수 있게 upstream으로 적는다.
upstream client_review_api {
    server host.docker.internal:4101;
}

server {
    listen 80;
    absolute_redirect off;

    # 맥에서 게시 포트(4103)로 들어온 요청은 Docker 망의 게이트웨이 주소로 보인다. 테스트가 이 길로
    # X-Forwarded-For를 넣어 서로 다른 고객을 흉내 낸다. 다른 컨테이너가 바로 보낸 값은 믿지 않는다.
    set_real_ip_from 172.17.0.1;
    include /etc/nginx/client-ip.conf;
    root /usr/share/nginx/html;

    include /etc/nginx/landing.conf;

    location /app/ {
        proxy_pass http://host.docker.internal:5174;
        # web 개발 서버(Vite)는 모르는 Host를 막는다. 브라우저가 연 주소(localhost:4103)를 그대로 넘긴다.
        proxy_set_header Host $http_host;
        # 화면을 고치면 바로 다시 그리는 연결(웹소켓)도 넘긴다. 안 넘기면 개발 서버 연결 오류가 콘솔에 남는다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    set $api_upstream http://client_review_api;
    include /etc/nginx/login-limit.conf;

    location /api/ {
        proxy_pass http://host.docker.internal:4101;
        proxy_set_header Host $http_host;
    }
}
