# 소개·방침·약관 주소. nginx.conf(배포)와 e2e/nginx.e2e.conf(브라우저 e2e)가 server 안에서 함께 include해서,
# 테스트가 배포와 같은 주소 규칙을 확인한다. 파일은 root(landing 폴더를 복사한 곳)에서 찾는다.

# 앱·api 밖의 없는 주소(/abc)는 404 상태로 소개 페이지와 같은 모양의 404 화면을 보낸다.
# /app/은 없는 주소도 React가 받고(index.html), /api/는 api가 보낸 404를 그대로 넘겨서 여기에 걸리지 않는다.
error_page 404 /404.html;

location = / {
    try_files /index.html =404;
}

# 주소에는 .html을 붙이지 않는다. 메일이나 화면에 적는 주소가 짧고, 파일 이름이 바뀌어도 주소가 그대로다.
location = /privacy {
    try_files /privacy.html =404;
}

location = /terms {
    try_files /terms.html =404;
}

# landing.css·robots.txt 같은 나머지 파일은 따로 적지 않아도 server의 root에서 그대로 나간다.
