# 로그인 코드 요청에 IP 제한을 건다(docs/deploy.md 정할 것 4). server 블록 안에서 include하고,
# 그 블록이 api 주소를 $api_upstream으로 정한다.
# api(Express)는 대소문자가 다른 주소와 끝에 /가 붙은 주소도 같은 요청으로 받아서, 여기서도 모두 잡는다.
location ~* ^/api/auth/email-code/?$ {
    # 여유 5번까지는 기다리지 않고 바로 보내고, 그보다 많으면 429다.
    limit_req zone=login_code burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @ip_rate_limited;

    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    # 머리글은 운영 nginx.conf의 /api/와 같게 넘긴다.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 화면은 code를 보고 api의 60초 429와 다른 문구를 보인다.
location @ip_rate_limited {
    default_type application/json;
    return 429 '{"statusCode":429,"code":"IP_RATE_LIMITED"}';
}
