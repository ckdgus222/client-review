server {
    listen 80;

    # Docker 내부 DNS. api 컨테이너를 다시 만들어 IP가 바뀌어도 10초 안에 새 주소를 찾는다.
    resolver 127.0.0.11 valid=10s;

    # 되돌려 보내는 주소를 /app/처럼 짧게 쓴다. 안 그러면 nginx가 자기 포트(80)를 붙여서
    # 맥의 8080으로 들어온 사람이 http://localhost/app/(80번)으로 잘못 가게 된다.
    absolute_redirect off;

    root /usr/share/nginx/html;

    # 소개·방침·약관 주소. 브라우저 e2e(e2e/nginx.e2e.conf)도 같은 파일을 include한다.
    include /etc/nginx/landing.conf;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        # 없는 파일 주소(예: /app/projects/1)는 index.html을 보내고 React가 주소를 처리한다.
        try_files $uri $uri/ /app/index.html;
    }

    location /api/ {
        # 기본값 1 MB로는 화면 사진이 api까지 가지 못한다. 사진 한 장 제한(20 MiB)은 api가 정하고,
        # 여기는 요청 포장(칸 이름 등)만큼 여유를 둔다. 이보다 크면 nginx가 413을 준다.
        client_max_body_size 21m;

        # 변수로 쓰면 nginx가 켤 때 한 번이 아니라 요청 때마다 주소를 찾는다(위 resolver).
        set $api http://api:4100;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
