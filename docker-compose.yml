# 이름을 적지 않으면 폴더 이름이 묶음 이름이 된다. 워크트리에서 켜도 같은 DB를 쓰게 고정한다.
name: client-review

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: client_review
      POSTGRES_DB: client_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 적어 주세요}
    ports:
      # 이 컴퓨터에서만 붙을 수 있게 127.0.0.1에만 연다. 5432·5433은 다른 프로젝트가 쓴다.
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "client_review", "-d", "client_review"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      # 컨테이너 안에서 DB 주소는 서비스 이름 db다. 맥에서 쓰는 .env의 DATABASE_URL(localhost:5434)과 다르다.
      DATABASE_URL: postgresql://client_review:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 적어 주세요}@db:5432/client_review
    depends_on:
      db:
        condition: service_healthy
    # 작은 init 프로그램(tini)이 1번 프로세스가 되어 docker stop 신호를 api에 바로 전한다.
    init: true

volumes:
  db-data:
