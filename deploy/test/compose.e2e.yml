# 운영 스크립트 e2e(api/test/backup-restore.e2e.spec.ts)가 띄우는 따로 떨어진 묶음(docs/deploy.md 정할 것 12).
# 테스트가 COMPOSE_FILE로 이 파일을, COMPOSE_PROJECT_NAME으로 테스트마다 다른 묶음 이름을 준다.
# 개발용 docker-compose.yml과 달리 name을 적지 않아서, 이름을 안 줘도 개발 DB(client-review 묶음)를 건드리지 않는다.
# 맥 포트를 열지 않는다. 스크립트는 운영처럼 docker compose exec로만 안을 본다.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: client_review
      POSTGRES_DB: client_review
      POSTGRES_PASSWORD: e2e
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "client_review", "-d", "client_review"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ../../api
    # 테스트마다 다시 만들지 않게 이미지 이름을 고정한다.
    image: client-review-deploy-e2e-api
    environment:
      DATABASE_URL: postgresql://client_review:e2e@db:5432/client_review
      APP_ORIGINS: http://localhost
      APP_URL: http://localhost
      DEVELOPER_EMAIL: developer@example.com
      ASSET_DIR: /data/assets
      # 메일은 보내지 않고 api 로그에 찍는다. 테스트가 로그에서 알림 메일을 확인한다.
      MAIL_MODE: log
    volumes:
      - assets-data:/data/assets
    depends_on:
      db:
        condition: service_healthy
    init: true

  nginx:
    build:
      context: ../..
      dockerfile: nginx/Dockerfile
    image: client-review-deploy-e2e-nginx
    depends_on:
      - api

volumes:
  db-data:
  assets-data:
