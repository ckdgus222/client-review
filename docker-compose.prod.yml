# 운영 서버에서만 기본 파일(docker-compose.yml) 위에 겹친다(docs/deploy.md 정할 것 10).
# 서버 .env에 COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml 을 적어 두면
# docker compose 명령과 deploy/ 스크립트가 늘 두 파일을 함께 읽는다.

services:
  db:
    # 서버가 아침에 켜지거나 컨테이너가 죽으면 Docker가 다시 띄운다. 손으로 stop 한 것은 다시 켜지 않는다.
    restart: unless-stopped

  api:
    restart: unless-stopped
    environment:
      # 고객이 브라우저에 적는 주소 하나(예: https://review.example.com). 끝에 /를 붙이지 않는다.
      APP_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL을 .env에 적어 주세요}
      APP_URL: ${PUBLIC_URL}
      # 운영은 https라 세션 쿠키를 https에서만 보낸다.
      COOKIE_SECURE: "true"
      # 운영은 메일을 실제로 보낸다. SMTP 값이 하나라도 비면 api가 켜지지 않는다(docs/mail.md).
      MAIL_MODE: smtp

  nginx:
    restart: unless-stopped
    # 80·443은 dog-walk nginx(앞단)가 쥐고 있다. 서버 포트를 열지 않고 edge 망으로만 받는다.
    ports: !reset []
    networks:
      default:
      edge:
        # 두 저장소 모두 서비스 이름이 nginx라, 앞단이 찾을 이름을 따로 준다.
        aliases:
          - client-review-nginx
        # 주소를 고정한다. 안 정하면 Docker가 빈 주소 중 첫 번째를 줘서, 이 컨테이너가 먼저 켜지면
        # 앞단의 고정 주소(172.30.0.2, nginx.conf가 믿는 주소)를 차지하고 앞단이 켜지지 못한다.
        ipv4_address: 172.30.0.3

networks:
  # 서버에서 한 번 만든다: docker network create --subnet 172.30.0.0/24 edge
  edge:
    external: true
